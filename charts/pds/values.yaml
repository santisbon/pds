image:
  repository: ghcr.io/bluesky-social/pds
  pullPolicy: IfNotPresent
  # "0.4" is upstream's rolling tag; with IfNotPresent a node that has it
  # cached never re-pulls. To deterministically deploy a specific upstream
  # release, set this to its immutable sha-<git-commit> tag instead.
  # See README "The rolling 0.4 image tag".
  tag: "0.4"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 3000

# Gateway API HTTPRoute. MicroK8s ingress addon provisions a Traefik-based
# Gateway named "traefik-gateway" in the "ingress" namespace.
httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
  hostnames: []
  # - yourdomain.com

# Application config
config:
  # Required: public hostname the PDS is reachable at, without scheme (e.g. yourdomain.com).
  # This is used as PDS_HOSTNAME and becomes the did:web identity for the server.
  # Cannot be changed after first start without migrating all accounts.
  hostname: ""

  # Admin contact email address (PDS_CONTACT_EMAIL_ADDRESS).
  adminEmail: ""

  # From address for outbound email (PDS_EMAIL_FROM_ADDRESS).
  emailFromAddress: ""

  # Branding. serviceName, homeUrl, and logoUrl apply to the email templates
  # (confirm/reset/delete/PLC-operation emails) and to the web screens the PDS
  # itself serves (sign-in, sign-up, OAuth authorization, account management).
  # The remaining values apply to the web screens only. All optional; unset,
  # serviceName defaults to "<hostname> PDS", emails fall back to Bluesky's
  # own logo/mark images and a https://bsky.app home link, and the web screens
  # show no logo, footer links, or background at all.
  # In emails, logoUrl is a single image used for both the header logo (110px)
  # and the small corner mark (24px), just at different sizes; on the web
  # screens the same image also appears above the sign-in card, and there it
  # only loads over https:. See README "Branding".
  serviceName: ""
  homeUrl: ""
  logoUrl: ""
  # Footer links on the web screens (not used in emails). Unset links don't
  # appear.
  privacyPolicyUrl: ""
  termsOfServiceUrl: ""
  supportUrl: ""
  # Web screen colors. Any CSS color, e.g. "#1083fe" or "rgb(16 131 254)".
  # Unset falls back to the stock palette: primary #8338ec, error #dc2626,
  # warning #ffab0f, info #007aff, success #17cc88. Text on primary-colored
  # buttons switches between black and white automatically for contrast.
  primaryColor: ""
  errorColor: ""
  warningColor: ""
  infoColor: ""
  successColor: ""
  # Background image behind the auth card, picked by the visitor's light/dark
  # preference and scaled to fill (cropped at the edges). https: URLs only.
  # ~2000px wide, well-compressed (comfortably under 1 MB) is plenty.
  backgroundLightUrl: ""
  backgroundDarkUrl: ""

  # Require an invite code to create an account. Recommended for personal PDS.
  inviteRequired: true

  # Enable rate limiting.
  rateLimitsEnabled: true

  # Upload size limit in bytes (300 MB, matching the upstream default; it was
  # 100 MB before chart 0.2.0 - set the old value here explicitly if you want
  # to keep the smaller cap). Advertised to clients via the unauthenticated
  # com.atproto.server.describeServer endpoint. Large uploads on slow RGW
  # hardware may also need blobstore.uploadTimeoutMs raised.
  blobUploadLimit: 314572800

  # Port the PDS process listens on inside the container.
  port: 3000

  logLevel: info

# OpenTelemetry metrics, off by default. When enabled, the chart sets
# NODE_OPTIONS=--import=@atproto/pds/telemetry on the PDS container (loading
# the OTel SDK bundled inside the PDS image) plus the OTEL_* env vars below,
# and the PDS pushes metrics over OTLP to metricsEndpoint. There is no
# /metrics endpoint to scrape. Requires an image with @atproto/pds 0.5.26+
# (label social.bsky.pds.telemetry=otel); on older images the PDS exits with
# ERR_PACKAGE_PATH_NOT_EXPORTED and crash-loops. See README
# "Metrics (OpenTelemetry)".
telemetry:
  enabled: false
  # Required when enabled: an OTLP metrics receiver URL reachable from the
  # pod, e.g. a Prometheus v3 with its OTLP receiver enabled:
  #   http://<prometheus-svc>.<namespace>.svc:9090/api/v1/otlp/v1/metrics
  # or an OpenTelemetry Collector's OTLP HTTP port.
  metricsEndpoint: ""
  # OTEL_SERVICE_NAME
  serviceName: "pds"
  # OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
  metricsProtocol: "http/protobuf"
  # OTEL_METRIC_EXPORT_INTERVAL (milliseconds)
  metricExportInterval: 15000
  # OTEL_SEMCONV_STABILITY_OPT_IN. Upstream's Grafana dashboard is built
  # against the stable HTTP semantic convention names this opts into.
  semconvStabilityOptIn: "http"
  # OTEL_NODE_RESOURCE_DETECTORS. Deliberately drops the default set's
  # AWS/GCP/Azure detectors, which probe cloud metadata services at startup
  # and log warnings on non-cloud clusters.
  nodeResourceDetectors: "env,host,os,process,serviceinstance,container"
  # Additional OTEL_* variables rendered verbatim as env vars, e.g. to also
  # enable traces or logs (the PDS enables exactly the signals you configure):
  #   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo.monitoring.svc:4318/v1/traces
  extraEnv: {}

# S3-compatible blobstore. Points at the MicroCeph RGW object gateway.
# Use the node's LAN IP rather than a .local hostname: mDNS does not resolve
# inside pods. RGW must be enabled on the cluster and a user with an
# access_key/secret_key must exist (see RPi.md Object storage section).
blobstore:
  bucket: "pds-blobs"
  # RGW requires path-style addressing; virtual-hosted style won't resolve without wildcard DNS.
  forcePathStyle: true
  region: "us-east-1"
  # Replace with your node-01 LAN IP (e.g. http://192.168.1.100:7480).
  endpoint: ""
  # Max time (ms) a single blob upload to the S3 blobstore may take before the
  # PDS aborts it. Unset uses the upstream PDS default (20000). Raise this if
  # blob uploads fail with "Blob upload timed out" under load (e.g. a resource-
  # constrained RGW node under concurrent uploads during an account migration).
  uploadTimeoutMs: ""

# First PDS user account. Created manually post-install via pdsadmin (see NOTES after helm upgrade).
# These values are not used by any chart template; they are here as a reference for the operator.
pdsUser:
  # Handle for the account, must be under the PDS hostname (e.g. you.yourdomain.com).
  handle: ""
  # Email address for the account.
  email: ""

# Credentials. Set at install time with --set or -f my-secrets.yaml.
# Do not commit values containing these to source control.
credentials:
  jwtSecret: ""
  adminPassword: ""
  # One secp256k1 private key for the whole server (not one per user).
  # User accounts get did:plc identities on plc.directory at account-creation
  # time. Each genesis operation lists this key as the rotation authority so
  # the server can sign future DID updates (handle changes, hostname migration).
  # The server's own identity is did:web (from config.hostname); this key is
  # only for hosted user account DIDs. Back up outside the cluster.
  # Generate with: openssl rand -hex 32
  plcRotationKey: ""
  # MicroCeph RGW credentials from: sudo radosgw-admin user create --uid=pds --display-name=pds
  blobstoreAccessKeyId: ""
  blobstoreSecretAccessKey: ""
  # SMTP connection string for outbound email (PDS_EMAIL_SMTP_URL). Optional —
  # required for account email verification. Embeds credentials (e.g. a
  # Resend API key), so it lives here rather than under config.*: config.* values
  # are rendered as plain env vars on the Deployment, which isn't covered by this
  # cluster's Secret/ConfigMap-scoped encryption-at-rest and is readable by
  # anyone with Deployment/Pod read access (a much wider RBAC surface than
  # Secret access). Leave blank to disable email.
  # Format: smtps://user:password@smtp.example.com or smtp://user:password@smtp.example.com:587
  emailSmtpUrl: ""
  # Name of a pre-existing Secret to use instead of creating one.
  # Must contain keys: jwt-secret, admin-password, plc-rotation-key,
  #   blobstore-access-key-id, blobstore-secret-access-key, and (if email is used)
  #   email-smtp-url
  existingSecret: ""

# PVC for SQLite databases and per-user actor stores (/pds directory).
# Blobs are stored in MicroCeph RGW, not here.
persistence:
  storageClass: "ceph-rbd"
  size: 5Gi
  existingClaim: ""

cloudflare:
  enabled: false
  # ID of the tunnel created with: cloudflared tunnel create pds
  tunnelId: ""
  # Public hostname to expose, must match config.hostname (e.g. yourdomain.com).
  hostname: ""
  # Name of a pre-existing Secret containing credentials.json from:
  #   kubectl create secret generic <name> \
  #     --from-file=credentials.json=~/.cloudflared/<tunnel-id>.json
  credentialsSecret: "cloudflared-credentials"
  image:
    # Pin to a specific release; check https://github.com/cloudflare/cloudflared/releases
    tag: "2026.6.1"
    pullPolicy: IfNotPresent

# Resources sized for a 3-node Raspberry Pi cluster:
# - node-01 (control plane): 8 GB RAM
# - node-02, node-03 (workers): 4 GB RAM each
# The PDS is a Node.js app serving a personal instance (1–20 users).
# A container limit avoids BestEffort QoS (oom_score_adj=1000) and keeps
# the kernel from killing this pod before less-critical workloads under
# memory pressure.
resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /xrpc/_health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /xrpc/_health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5

nodeSelector: {}

tolerations: []

affinity: {}
